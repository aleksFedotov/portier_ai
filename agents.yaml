# Справочник агентов (тикет 13): «счётные» агенты из документа
# «Работа с агентами». Сидится в БД при пустой таблице agents.
# aliases — как канал выглядит в подтверждениях TravelLine (через «;»).
# price_note — скидка/комиссия: процент из неё бот применяет к сумме счёта
# (тикет 29); без процента («цену не меняем») сумма не корректируется.
# invoice_email — куда отправлять счёт (тикет 12); пусто — на адрес из письма.
# edit_note — инструкция админу по редактированию брони (тикет 30): непустая →
# по booking_confirmed в основную группу уходит напоминание «отредактируйте бронь».
# invoice_on_booking: false — только напоминание, автосчёт не выставляется.

